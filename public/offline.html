<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000"><title>PeekaSnap · Offline</title>
<style>html,body{margin:0;height:100%;background:#000;color:#fff;font-family:-apple-system,Roboto,Helvetica,Arial,sans-serif}
body{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:32px calc(24px + env(safe-area-inset-right)) calc(32px + env(safe-area-inset-bottom)) calc(24px + env(safe-area-inset-left))}
img{width:110px;height:110px;border-radius:30px;box-shadow:0 0 40px rgba(255,45,70,.5)}
h1{font-size:26px;margin:22px 0 6px}p{color:#aaa;max-width:300px}
button{margin-top:18px;background:#FF2D46;color:#fff;border:0;border-radius:999px;padding:14px 26px;font-weight:800;font-size:16px}</style></head>
<body><img src="/icons/icon-192.png" alt=""><h1>You're offline</h1>
<p>PeekaSnap needs a connection for pings, the map and chat. We'll reconnect as soon as you're back online.</p>
<button onclick="location.reload()">Try again</button>
<script>addEventListener('online', () => location.reload());</script></body></html>
